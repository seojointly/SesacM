services:
  jenkins:
    build: .
    container_name: jenkins
    user: root  # 실습 환경에서 호스트 소켓(/var/run/docker.sock) 접근 권한 해결
    ports:
      - "8085:8080"    # Jenkins Web UI (8085 - 충돌방지위함)
      - "50000:50000"  # Jenkins Agent Port
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always