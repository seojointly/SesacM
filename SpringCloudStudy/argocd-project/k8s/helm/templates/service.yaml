apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}  # argocd-project
  labels:
    app: {{ .Chart.Name }}
spec:
  type: {{ .Values.service.type }}  # LoadBalancer
  ports:
    - port: {{ .Values.service.port }}  # 80
      targetPort: {{ .Values.service.targetPort }}  # 8080
      protocol: TCP
      name: http
  # Deployment의 label과 일치해야 트래픽이 전달됨
  selector:
    app: {{ .Chart.Name }}