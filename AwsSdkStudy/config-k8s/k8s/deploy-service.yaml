apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-k8s-deploy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-k8s-deploy
  template:
    metadata:
      labels:
        app: config-k8s-deploy
    spec:
      containers:
        - name: config-k8s-container
          image: config-k8s:latest 
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: config-k8s-service
  namespace: default
spec:
  type: NodePort 
  selector:
    app: config-k8s-deploy
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080