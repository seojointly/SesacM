name: CI/CD Pipeline with GitOps

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      # [변경] Repository Root 기준 실제 k8s 경로로 수정
      # 기존: 'k8s/**'
      - 'SpringCloudStudy/argocd-project/k8s/**'

jobs:
  # === 1. CI Job: 코드 빌드, 도커 이미지 생성 및 레지스트리 푸시 ===
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 21 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Gradle 빌드
      - name: Build with Gradle
        # [변경] gradlew가 존재하는 실제 프로젝트 디렉터리 지정
        working-directory: SpringCloudStudy/argocd-project
        run: |
          chmod +x gradlew
          ./gradlew clean build

      # === 4, 5 = buildx 설정 ===

      # 4. QEMU 설정
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 5. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 7. Docker 이미지 빌드 및 푸시
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          # [변경] Dockerfile이 존재하는 실제 프로젝트 디렉터리를 context로 지정
          # 기존: context: .
          context: ./SpringCloudStudy/argocd-project

          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/argocd-project:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # === 2. CD Job (GitOps): Helm values.yaml 매니페스트 태그 업데이트 및 커밋/푸시 ===
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 최신 main 브랜치 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      # 2. Helm values.yaml 태그 업데이트
      - name: Update Helm Values
        run: |
          # [변경] 실제 values.yaml의 Repository Root 기준 경로로 수정
          # 기존: k8s/helm/values.yaml
          sed -i 's/tag: ".*"/tag: "${{ github.run_number }}"/g' SpringCloudStudy/argocd-project/k8s/helm/values.yaml

          # [변경] 실제 values.yaml 경로로 수정
          cat SpringCloudStudy/argocd-project/k8s/helm/values.yaml

      # 3. 변경 사항 커밋 및 푸시
      - name: Commit and Push Manifest changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # [변경] 실제 values.yaml 경로로 수정
          # 기존: git add k8s/helm/values.yaml
          git add SpringCloudStudy/argocd-project/k8s/helm/values.yaml

          # 변경사항이 있을 때만 커밋 수행
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci(gitops): update image tag to ${{ github.run_number }} [skip ci]"
            git push origin main
          fi