service: s3-direct-crud-5

provider:
  name: aws
  runtime: java21
  region: ap-northeast-2
  memorySize: 2048
  timeout: 20
  environment:
    BUCKET_NAME: ${self:custom.bucketName}
  # httpApi.cors: 프론트엔드(React 등)와 연동 시 필수 (백엔드 통신 시 사용 안 함)
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - '*'
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - !Sub "arn:aws:s3:::${self:custom.bucketName}"
            - !Sub "arn:aws:s3:::${self:custom.bucketName}/*"

custom:
  # 본인 계정으로 변경
  userName: 5
  bucketName: s3-crud-bucket-${aws:accountId}-${self:custom.userName}

package:
  artifact: build/libs/s3-direct-crud-0.0.1-SNAPSHOT.jar

functions:
  s3Handler:
    handler: com.example.s3.controller.S3CrudHandler::handleRequest
    snapStart: true
    events:
      - httpApi:
          path: /api/s3/files
          method: post
      - httpApi:
          path: /api/s3/files
          method: get
      # {key+}: 경로에 포함된 모든 하위 슬래시(/)를 하나의 전체 경로 문자열로 캡처함
      - httpApi:
          path: /api/s3/files/{key+}
          method: get
      - httpApi:
          path: /api/s3/files/{key+}
          method: delete

resources:
  Resources:
    CrudBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucketName}