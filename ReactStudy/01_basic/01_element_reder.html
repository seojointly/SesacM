<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <title>Document</title>
</head>
<body>
  
<div id="root1"></div>
<script type="text/babel" data-presets="typescript,react">

/** @type {any} */
  const globalWindow = window; // any는 추천 안함
  const { React, ReactDOM } = globalWindow; // 만들 때 React, 그릴 때 ReactDOM

  // React로 Element 만들기
  const h1Element = React.createElement(
    'h1', // 태그 이름
    {
      id: 'title', // 프로퍼티
      className: 'title',
    },
    'Hello World' // 태그 내부 텍스트
  )
  // ReactDOM으로 Element 그리기
  /** @type {HTMLElement} */
    const root1 = document.getElementById('root1') // 원래 타입스크립트: as HTMLElement; 가 붙음 (같은 효과, 다른문법으로 사용 javascripts dock 타입으로 작성.)
    ReactDOM.createRoot(root1).render(h1Element);
</script>

<div id="root2"></div>
<script type="text/babel" data-presets="typescript,react">
  const globalWindow2 = window;
  // const { React, ReactDOM } = globalWindow2;

  // 1. 화면을 그릴 root 생성 (최초 1회만 수행)
  /** @type {HTMLElement} */
  const root2Element = document.getElementById('root2');
  const root2 = ReactDOM.createRoot(root2Element);

  // 단순 텍스트 Element 만들기

  // 2. 1초마다 실행될 함수 만들기
  setInterval(() => {
    // 현재 시간을 지역 시간대 문자열로 가져오기 (오타 교정: toLocaleTimeString)
    const currentTime = new Date().toLocaleTimeString();

    // React로 h1 태그 안에 시간 넣어서 Element 만들기
    const clockElement = React.createElement(
      'h1',
      {
        id: 'clock',
        className: 'digital-clock',
      },
      currentTime
    );

    // 만든 Element를 root2에 매번 새로 그리기 (Render)
    root2.render(clockElement);
  }, 1000);
  
</script>

</body>
</html>
