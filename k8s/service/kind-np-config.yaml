# ~/k8s/service/kind-np-config.yaml

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30007      # 노드 포트 30007
    hostPort: 30007           # 로컬 호스트 포트 30007
    listenAddress: "0.0.0.0"
    protocol: TCP
- role: worker                # 워커 노드 역시 30007 포트가 열림